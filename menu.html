<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿題クイズ・教材 URL一覧</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue-dark:#1a56a8; --blue-mid:#2563eb; --blue-light:#60a5fa;
  --blue-pale:#dbeafe; --blue-bg:#eff6ff;
  --green:#10b981; --gold:#f59e0b; --brown:#92400e;
  --text:#1e293b; --gray:#64748b;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family:'Nunito','Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#dbeafe 0%,#eff6ff 60%,#e0f2fe 100%);
  color:var(--text); min-height:100vh; font-size:16px;
}
.hero{
  background:linear-gradient(135deg,var(--blue-dark),var(--blue-mid),#0ea5e9);
  color:white; text-align:center; padding:26px 16px 20px;
}
.hero h1{ font-size:clamp(1.3rem,4.5vw,1.9rem); font-weight:900; margin-bottom:6px; }
.hero p{ font-size:.9rem; opacity:.88; }
.main{ max-width:640px; margin:0 auto; padding:16px 14px 60px; }
.hint{
  background:#fff7ed; border:2px dashed var(--gold); border-radius:12px;
  padding:12px 16px; font-size:.88rem; line-height:1.7; margin-bottom:16px;
}
.hint strong{ color:var(--brown); }
.section-title{
  font-size:1.05rem; font-weight:900; color:var(--blue-dark);
  margin:22px 4px 10px; display:flex; align-items:center; gap:8px;
}
.section-title::after{ content:''; flex:1; height:2px; background:var(--blue-pale); border-radius:2px; }
.quiz-card{
  background:white; border-radius:14px; padding:18px;
  box-shadow:0 4px 16px rgba(37,99,235,.13); margin-bottom:14px;
}
.quiz-title{ font-size:1.1rem; font-weight:900; color:var(--blue-dark); margin-bottom:2px; }
.quiz-sub{ font-size:.82rem; color:var(--gray); margin-bottom:10px; }
.quiz-url{
  font-size:.78rem; color:var(--gray); word-break:break-all;
  background:var(--blue-bg); border-radius:8px; padding:7px 10px; margin-bottom:10px;
}
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.btn{
  padding:10px 16px; border-radius:100px; border:none; cursor:pointer;
  font-family:inherit; font-size:.9rem; font-weight:800; transition:all .15s;
  text-decoration:none; display:inline-block;
}
.btn-open{ background:white; color:var(--blue-mid); border:2px solid var(--blue-mid); }
.btn-open:hover{ background:var(--blue-pale); }
.btn-copy-url{ background:var(--blue-mid); color:white; }
.btn-copy-url:hover{ background:var(--blue-dark); }
.btn-copy-msg{ background:var(--green); color:white; }
.btn-copy-msg:hover{ background:#059669; }
.toast{
  position:fixed; bottom:30px; left:50%;
  transform:translateX(-50%) translateY(150px); opacity:0; visibility:hidden;
  background:#1e293b; color:white; padding:12px 28px;
  border-radius:100px; font-weight:700; font-size:.95rem;
  z-index:999; transition:transform .3s,opacity .3s;
  pointer-events:none; white-space:nowrap;
}
.toast.show{ transform:translateX(-50%) translateY(0); opacity:1; visibility:visible; }
.footer{ text-align:center; font-size:.78rem; color:var(--gray); margin-top:24px; line-height:1.7; }
</style>
</head>
<body>

<div class="hero">
  <h1>📚 宿題クイズ・教材 URL一覧</h1>
  <p>先生用ページ — このページをブックマークしておけば全部ここから送れます</p>
</div>

<div class="main">

<div class="hint">
  <strong>使い方:</strong> 生徒に送るときは，送りたい教材の
  <strong style="color:#059669">「📩 送信文をコピー」</strong>を押す →
  メールやLINEに貼り付けて送信するだけ。あいさつ文とURLがセットでコピーされます。
</div>

<div class="section-title">🏆 英検3級 文法クイズ</div>
<div id="eikenList"></div>

<div class="section-title">📖 NEW HORIZON 1 ゲーム教材</div>
<div id="nh1List"></div>

<div class="section-title">📖 NEW CROWN 3 ゲーム教材</div>
<div id="nc3List"></div>

<div class="section-title">📖 SUNSHINE 1 ゲーム教材</div>
<div id="s1List"></div>

<div class="footer">
  新しい教材が増えると，このページにも自動で追加されます。<br>
  ※このページと各教材は，URLを知っている人なら誰でも見られます。<br>
  （個人情報を載せないよう配慮して作っています）
</div>

</div>

<div class="toast" id="toast"></div>

<script>
const BASE = 'https://ykkm-english.github.io/eiken-quiz/';

const QUIZZES = [
  { unit:'不定詞',        sub:'to＋動詞 · 全4ステージ23問＋英作文', file:'index.html',       q:'23' },
  { unit:'動名詞',        sub:'動詞＋ing · 全4ステージ22問＋英作文', file:'gerund.html',      q:'22' },
  { unit:'比較級・最上級', sub:'-er / -est / more / most · 全4ステージ22問＋英作文', file:'comparative.html', q:'22' },
  { unit:'受け身',        sub:'be動詞＋過去分詞 · 全4ステージ22問＋英作文', file:'passive.html',     q:'22' },
  { unit:'現在完了',      sub:'have/has＋過去分詞 · 全4ステージ22問＋英作文', file:'present_perfect.html', q:'22' },
  { unit:'不定詞の応用',  sub:'how to / It is ... to · 全4ステージ22問＋英作文', file:'infinitive2.html', q:'22' },
  { unit:'接続詞',        sub:'that / when / if / because · 全4ステージ22問＋英作文', file:'conjunction.html', q:'22' },
  { unit:'関係代名詞',    sub:'who / which / that · 全4ステージ22問＋英作文', file:'relative.html',    q:'22' },
];

const NH1_GAMES = [
  { book:'NEW HORIZON 1', unit:'Unit 2 Part 1', sub:'単語カード・クイズ・本文', file:'nh1/unit2_part1.html' },
  { book:'NEW HORIZON 1', unit:'Unit 2 Part 2', sub:'単語カード・クイズ・本文', file:'nh1/unit2_part2.html' },
  { book:'NEW HORIZON 1', unit:'Unit 2 Part 3', sub:'単語カード・クイズ・本文', file:'nh1/unit2_part3.html' },
  { book:'NEW HORIZON 1', unit:'Unit 3 Part 1', sub:'単語カード・クイズ・本文', file:'nh1/unit3_part1.html' },
  { book:'NEW HORIZON 1', unit:'Unit 3 Part 2', sub:'単語カード・クイズ・本文', file:'nh1/unit3_part2.html' },
];

const NC3_GAMES = [
  { book:'NEW CROWN 3', unit:'L2 Take Action Talk 2', sub:'単語カード・クイズ・本文', file:'nc3/l2_takeaction_talk2.html' },
  { book:'NEW CROWN 3', unit:'L2-2 Bruno Mars 単語ゲーム', sub:'単語カード・クイズ', file:'nc3/l2_2_bruno_mars_words.html' },
  { book:'NEW CROWN 3', unit:'Help! The Beatles 単語ゲーム', sub:'単語カード・クイズ', file:'nc3/beatles_words.html' },
];

const S1_GAMES = [
  { book:'SUNSHINE 1', unit:'Program 2 Part 1', sub:'単語カード・クイズ・本文', file:'s1/prog2_part1.html' },
  { book:'SUNSHINE 1', unit:'Program 2 Part 2', sub:'単語カード・クイズ・本文', file:'s1/prog2_part2.html' },
  { book:'SUNSHINE 1', unit:'Program 3', sub:'単語カード・クイズ・本文', file:'s1/prog3.html' },
  { book:'SUNSHINE 1', unit:'Program 3 Part 2', sub:'単語カード・クイズ・本文', file:'s1/prog3_part2.html' },
];

function urlOf(item){
  return item.file === 'index.html' ? BASE : BASE + item.file;
}
function quizMessage(item){
  return 'こんにちは。今週の英語の宿題クイズ（' + item.unit + '）です。\n'
    + '下のリンクをタップすると始められます（iPadでそのまま開けます）。\n\n'
    + urlOf(item) + '\n\n'
    + '全部で' + item.q + '問＋英作文チャレンジです。満点目指してがんばってね！';
}
function nh1Message(item){
  return '英語の授業で使ったゲーム教材（' + item.book + ' ' + item.unit + '）です。\n'
    + '下のリンクをタップすると開けます（iPadでそのまま使えます）。\n\n'
    + urlOf(item) + '\n\n'
    + '単語カードやクイズで復習してね！';
}

function makeCard(item, msgFnName, listName, i){
  return `
    <div class="quiz-card">
      <div class="quiz-title">${item.unit}</div>
      <div class="quiz-sub">${item.sub}</div>
      <div class="quiz-url">${urlOf(item)}</div>
      <div class="btn-row">
        <a class="btn btn-open" href="${urlOf(item)}" target="_blank">👀 開いて確認</a>
        <button class="btn btn-copy-url" onclick="copyText(urlOf(${listName}[${i}]), 'URLをコピーしました')">🔗 URLだけコピー</button>
        <button class="btn btn-copy-msg" onclick="copyText(${msgFnName}(${listName}[${i}]), '送信文をコピーしました')">📩 送信文をコピー</button>
      </div>
    </div>`;
}

function render(){
  document.getElementById('eikenList').innerHTML =
    QUIZZES.map((item, i) => makeCard(item, 'quizMessage', 'QUIZZES', i)).join('');
  document.getElementById('nh1List').innerHTML =
    NH1_GAMES.map((item, i) => makeCard(item, 'nh1Message', 'NH1_GAMES', i)).join('');
  document.getElementById('nc3List').innerHTML =
    NC3_GAMES.map((item, i) => makeCard(item, 'nh1Message', 'NC3_GAMES', i)).join('');
  document.getElementById('s1List').innerHTML =
    S1_GAMES.map((item, i) => makeCard(item, 'nh1Message', 'S1_GAMES', i)).join('');
}

function copyText(text, doneMsg){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('✅ ' + doneMsg),
      () => fallbackCopy(text, doneMsg)
    );
  } else {
    fallbackCopy(text, doneMsg);
  }
}
function fallbackCopy(text, doneMsg){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('✅ ' + doneMsg); }
  catch(e){ showToast('⚠️ コピーできませんでした。URLを長押しでコピーしてください'); }
  document.body.removeChild(ta);
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

render();
</script>
</body>
</html>
