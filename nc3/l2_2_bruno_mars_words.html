<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEW CROWN 3 — Lesson 2 Part 2 Scene 2 新出単語</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8f0;
  --card: #ffffff;
  --gold: #f59e0b;
  --gold2: #d97706;
  --orange: #fb923c;
  --blue: #3b82f6;
  --blue2: #1d4ed8;
  --green: #16a34a;
  --red: #dc2626;
  --dark: #1c1917;
  --gray: #78716c;
  --shadow: 0 4px 20px rgba(245,158,11,0.18);
  --radius: 20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', 'Noto Sans JP', sans-serif;
  font-size: 20px;
  background: var(--bg);
  color: var(--dark);
  min-height: 100vh;
}

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ── TOP BAR ── */
.top-bar {
  background: white;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  position: sticky;
  top: 0;
  z-index: 50;
}
.back-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.top-bar-title { font-size: 1.1rem; font-weight: 900; flex: 1; }
.prog-wrap { flex: 2; }
.prog-outer { height: 10px; background: #e5e7eb; border-radius: 10px; }
.prog-inner {
  height: 10px; border-radius: 10px;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  transition: width .4s;
}
.prog-label { font-size: .72rem; color: var(--gray); text-align: right; margin-top: 2px; }

/* ── HOME ── */
#home {
  background: linear-gradient(160deg, #fef3c7 0%, #fff8f0 50%, #fde8d0 100%);
  align-items: center;
  padding-bottom: 48px;
}
.home-hero {
  width: 100%;
  padding: 36px 24px 20px;
  text-align: center;
}
.home-badge {
  display: inline-block;
  background: var(--gold);
  color: white;
  font-size: .82rem;
  font-weight: 900;
  letter-spacing: 2px;
  padding: 5px 18px;
  border-radius: 30px;
  margin-bottom: 16px;
}
.home-title {
  font-size: 2.4rem;
  font-weight: 900;
  line-height: 1.15;
  color: var(--dark);
  margin-bottom: 6px;
}
.home-title span { color: var(--gold2); }
.home-sub { font-size: 1rem; color: var(--gray); margin-bottom: 28px; }
.artist-card {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  background: white;
  border-radius: 28px;
  padding: 18px 32px;
  box-shadow: var(--shadow);
  margin-bottom: 28px;
  border: 3px solid var(--gold);
}
.artist-emoji { font-size: 4rem; margin-bottom: 8px; }
.artist-name { font-size: 1.5rem; font-weight: 900; color: var(--dark); }
.artist-sub { font-size: .9rem; color: var(--gray); }
.word-count-badge {
  display: inline-block;
  background: #fef3c7;
  border: 2px solid var(--gold);
  color: var(--gold2);
  font-size: .9rem;
  font-weight: 900;
  padding: 6px 18px;
  border-radius: 30px;
  margin-bottom: 28px;
}
.home-menu {
  width: 100%;
  max-width: 420px;
  padding: 0 20px;
}
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.menu-card {
  background: white;
  border-radius: 22px;
  padding: 24px 14px;
  text-align: center;
  cursor: pointer;
  border: 2.5px solid transparent;
  box-shadow: var(--shadow);
  transition: all .2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.menu-card:hover { transform: translateY(-4px); }
.menu-card:active { transform: scale(.96); }
.menu-icon { font-size: 2.6rem; }
.menu-name { font-size: 1.1rem; font-weight: 900; }
.menu-sub { font-size: .75rem; color: var(--gray); font-weight: 700; }
.menu-card.c-gold   { border-top: 5px solid var(--gold);   }
.menu-card.c-gold:hover { border-color: var(--gold); }
.menu-card.c-blue   { border-top: 5px solid var(--blue);   }
.menu-card.c-blue:hover { border-color: var(--blue); }
.menu-card.c-green  { border-top: 5px solid var(--green);  }
.menu-card.c-green:hover { border-color: var(--green); }
.menu-card.c-orange { border-top: 5px solid var(--orange); }
.menu-card.c-orange:hover { border-color: var(--orange); }
.menu-full { grid-column: 1 / -1; }

/* ── FLIP CARDS ── */
#vocab { background: var(--bg); overflow-y: auto; }
.vocab-mode-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  width: 100%;
}
.mode-toggle-btn {
  padding: 9px 24px;
  border-radius: 30px;
  border: 2.5px solid #e5e7eb;
  font-size: .95rem;
  font-weight: 900;
  cursor: pointer;
  background: white;
  color: var(--gray);
  font-family: inherit;
  transition: all .2s;
}
.mode-toggle-btn.active { background: var(--gold); color: white; border-color: var(--gold); }
.flip-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 22px 20px;
  gap: 18px;
  width: 100%;
}
.flip-counter-text { font-size: 1rem; font-weight: 900; color: var(--gray); }
.flip-card-wrap {
  width: 100%; max-width: 420px;
  cursor: pointer;
  position: relative;
}
.flip-face {
  border-radius: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 32px 28px;
  min-height: 220px;
  box-shadow: 0 8px 32px rgba(245,158,11,0.22);
}
.flip-face.hidden { display: none; }
.flip-front {
  background: linear-gradient(135deg, var(--gold2), var(--gold), var(--orange));
  color: white;
}
.flip-back {
  background: white;
  border: 3px solid var(--gold);
}
.flip-pos-badge {
  font-size: .85rem;
  font-weight: 900;
  padding: 4px 16px;
  border-radius: 20px;
}
.flip-front .flip-pos-badge { background: rgba(255,255,255,0.28); color: white; }
.flip-back .flip-pos-badge { background: #fef3c7; color: var(--gold2); }
.flip-main { font-size: 2.6rem; font-weight: 900; text-align: center; line-height: 1.2; }
.flip-front .flip-main { color: white; }
.flip-back .flip-main { color: var(--gold2); font-size: 2.2rem; }
.flip-sub { font-size: 1rem; font-weight: 700; text-align: center; opacity: .85; }
.flip-tap-hint { font-size: .78rem; opacity: .6; margin-top: 4px; }
.flip-speak-row {
  display: flex; gap: 10px;
  width: 100%; max-width: 420px;
}
.flip-speak-btn {
  flex: 1;
  padding: 13px;
  border-radius: 16px;
  background: white;
  border: 2.5px solid var(--gold);
  color: var(--gold2);
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.flip-speak-btn:hover { background: var(--gold); color: white; }
.flip-example-box {
  width: 100%; max-width: 420px;
  background: white;
  border-radius: 18px;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--orange);
}
.flip-ex-en { font-size: 1.05rem; font-weight: 700; color: var(--dark); margin-bottom: 6px; line-height: 1.6; }
.flip-ex-ja { font-size: .95rem; color: var(--gray); }
.ex-hl-en { color: var(--gold2); font-weight: 900; border-bottom: 2px solid var(--gold); }
.flip-nav {
  display: flex; gap: 12px;
  width: 100%; max-width: 420px;
}
.flip-prev, .flip-next {
  flex: 1;
  padding: 15px;
  border-radius: 16px;
  border: none;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}
.flip-prev { background: #e5e7eb; color: var(--dark); }
.flip-prev:hover { background: #d1d5db; }
.flip-prev:disabled { opacity: .4; cursor: default; }
.flip-next { background: linear-gradient(90deg, var(--gold), var(--orange)); color: white; }
.flip-next:hover { transform: scale(1.02); }
.flip-next:disabled { opacity: .4; cursor: default; }

/* ── QUIZ ── */
#quiz { background: var(--bg); overflow-y: auto; }
.quiz-area {
  flex: 1;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}
.quiz-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.quiz-q-label { font-size: 1rem; font-weight: 900; color: var(--gray); }
.quiz-score-badge {
  background: var(--gold);
  color: white;
  font-size: 1rem;
  font-weight: 900;
  padding: 5px 16px;
  border-radius: 30px;
}
.quiz-prog-outer { height: 10px; background: #e5e7eb; border-radius: 10px; }
.quiz-prog-inner {
  height: 10px; border-radius: 10px;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  transition: width .4s;
}
.quiz-card {
  background: white;
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: var(--shadow);
  text-align: center;
}
.quiz-label { font-size: .9rem; color: var(--gray); font-weight: 700; margin-bottom: 10px; }
.quiz-stem {
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 10px;
}
.quiz-jp { font-size: 1.1rem; color: var(--gray); font-weight: 700; }
.quiz-audio-btn {
  margin-top: 10px;
  background: #fef3c7;
  border: 2px solid var(--gold);
  color: var(--gold2);
  border-radius: 30px;
  padding: 5px 16px;
  font-size: .9rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
}
.quiz-opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.quiz-opt {
  background: white;
  border: 2.5px solid #e5e7eb;
  border-radius: 16px;
  padding: 18px 14px;
  font-family: inherit;
  font-size: 1.2rem;
  font-weight: 900;
  cursor: pointer;
  transition: all .15s;
  min-height: 72px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--gold); background: #fef3c7; }
.quiz-opt.correct { border-color: var(--green); background: #dcfce7; color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red);   background: #fee2e2; color: var(--red);   }
.quiz-opt:disabled { cursor: default; }
.quiz-feedback {
  border-radius: 16px;
  padding: 18px 20px;
  font-size: 1.05rem;
  line-height: 1.7;
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #dcfce7; border: 2px solid #bbf7d0; }
.quiz-feedback.ng { background: #fee2e2; border: 2px solid #fecaca; }
.quiz-fb-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 6px; }
.quiz-feedback.ok .quiz-fb-title { color: var(--green); }
.quiz-feedback.ng .quiz-fb-title { color: var(--red); }
.btn-next {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  color: white;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  transition: all .15s;
}
.btn-next:hover { transform: scale(1.01); }
.btn-next:disabled { background: #d1d5db; cursor: default; }

/* Quiz Result */
.quiz-result {
  background: white;
  border-radius: 24px;
  padding: 40px 28px;
  text-align: center;
  box-shadow: var(--shadow);
  display: none;
}
.quiz-result.show { display: block; }
.result-medal { font-size: 5rem; margin-bottom: 16px; }
.result-title { font-size: 1.6rem; font-weight: 900; color: var(--dark); margin-bottom: 8px; }
.result-score { font-size: 2.4rem; font-weight: 900; color: var(--gold2); margin-bottom: 12px; }
.result-msg { font-size: 1.05rem; color: var(--gray); line-height: 1.7; margin-bottom: 28px; }
.btn-retry {
  padding: 15px 40px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  color: white;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
}

/* ── WORD LIST ── */
#wordlist { background: var(--bg); overflow-y: auto; }
.wordlist-area {
  flex: 1;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}
.word-card {
  background: white;
  border-radius: 20px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 16px;
  border-left: 5px solid var(--gold);
}
.word-num {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--gold2);
  flex-shrink: 0;
  margin-top: 2px;
}
.word-body { flex: 1; }
.word-en {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 4px;
}
.word-pos-badge {
  display: inline-block;
  background: #fef3c7;
  color: var(--gold2);
  font-size: .8rem;
  font-weight: 900;
  padding: 2px 12px;
  border-radius: 20px;
  margin-bottom: 8px;
}
.word-ja { font-size: 1.2rem; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
.word-ex-en { font-size: 1rem; color: var(--gray); margin-bottom: 3px; }
.word-ex-ja { font-size: .92rem; color: var(--gray); }
.word-speak-btn {
  background: #fef3c7;
  border: 2px solid var(--gold);
  color: var(--gold2);
  border-radius: 30px;
  padding: 6px 14px;
  font-size: .9rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
  margin-top: 2px;
}
.word-speak-btn:hover { background: var(--gold); color: white; }

/* ── HONBUN ── */
#honbun { background: var(--bg); overflow-y: auto; }
.honbun-area {
  flex: 1;
  padding: 20px 18px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}
.honbun-section-label {
  font-size: .85rem;
  font-weight: 900;
  color: var(--gray);
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 6px 0 2px;
  border-bottom: 2px solid #e5e7eb;
  margin-bottom: 4px;
}
.sent-box {
  background: white;
  border-radius: 16px;
  padding: 16px 18px;
  box-shadow: 0 2px 10px rgba(245,158,11,0.10);
  border: 1.5px solid #f3f4f6;
}
.sent-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.sent-tab {
  padding: 5px 14px;
  border-radius: 100px;
  border: 2px solid #e5e7eb;
  background: white;
  font-family: inherit;
  font-size: .88rem;
  font-weight: 900;
  color: var(--gray);
  cursor: pointer;
  transition: all .15s;
}
.sent-tab.active { background: var(--gold); color: white; border-color: var(--gold); }
.sent-en {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.8;
  color: var(--dark);
  transition: filter .2s;
}
.sent-en .hl { color: var(--gold2); font-weight: 900; border-bottom: 2px solid var(--gold); }
.key-word {
  display: inline-block;
  border-radius: 4px;
  padding: 0 3px;
  font-weight: 900;
  color: var(--gold2);
  transition: background .15s, color .15s;
}
.key-word.masked {
  background: #1c1917;
  color: transparent !important;
  cursor: pointer;
  border-radius: 4px;
  min-width: 2em;
  border-bottom: none !important;
}
.sent-jp {
  font-size: 1rem;
  color: var(--gray);
  line-height: 1.7;
  margin-top: 6px;
  display: none;
}
.sent-audio-btn {
  background: #fef3c7;
  border: 1.5px solid var(--gold);
  color: var(--gold2);
  border-radius: 100px;
  padding: 3px 12px;
  font-size: .82rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  margin-left: 6px;
  vertical-align: middle;
}
.sent-audio-btn:hover { background: var(--gold); color: white; }
.honbun-all-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.all-mode-btn {
  padding: 8px 18px;
  border-radius: 100px;
  border: 2px solid var(--gold);
  background: white;
  color: var(--gold2);
  font-family: inherit;
  font-size: .92rem;
  font-weight: 900;
  cursor: pointer;
  transition: all .15s;
}
.all-mode-btn:hover { background: var(--gold); color: white; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--dark);
  color: white;
  padding: 12px 28px;
  border-radius: 100px;
  font-weight: 900;
  font-size: 1rem;
  z-index: 999;
  transition: transform .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── CONFETTI ── */
#confettiCanvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 900;
}

/* ── RESPONSIVE ── */
@media (max-width: 400px) {
  .home-title { font-size: 1.9rem; }
  .flip-main { font-size: 2rem; }
  .quiz-stem { font-size: 1.4rem; }
  .quiz-opt { font-size: 1.05rem; min-height: 64px; }
}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<!-- ─────────── HOME ─────────── -->
<div class="screen active" id="home">
  <div class="home-hero">
    <div class="home-badge">📘 NEW CROWN 3 · Lesson 2 Part 2 Scene 2</div>
    <div class="home-title">Bruno <span>Mars</span></div>
    <p class="home-sub">中3 · 新出単語をマスターしよう！</p>
    <div class="artist-card">
      <div class="artist-emoji">🎤</div>
      <div class="artist-name">Bruno Mars</div>
      <div class="artist-sub">アメリカ出身のシンガーソングライター</div>
    </div>
    <div class="word-count-badge">📚 今日の単語：5語</div>
  </div>
  <div class="home-menu">
    <div class="menu-row">
      <div class="menu-card c-gold" onclick="goTo('vocab')">
        <div class="menu-icon">🃏</div>
        <div class="menu-name">単語カード</div>
        <div class="menu-sub">タップでひっくり返す</div>
      </div>
      <div class="menu-card c-blue" onclick="startQuiz()">
        <div class="menu-icon">🎯</div>
        <div class="menu-name">クイズ</div>
        <div class="menu-sub">10問チャレンジ</div>
      </div>
    </div>
    <div class="menu-row">
      <div class="menu-card c-green" onclick="goTo('wordlist')">
        <div class="menu-icon">📖</div>
        <div class="menu-name">単語一覧</div>
        <div class="menu-sub">意味・例文をチェック</div>
      </div>
      <div class="menu-card c-orange" onclick="goTo('honbun')">
        <div class="menu-icon">📄</div>
        <div class="menu-name">本文</div>
        <div class="menu-sub">タップで文字を表示</div>
      </div>
    </div>
  </div>
</div>

<!-- ─────────── FLIP CARDS ─────────── -->
<div class="screen" id="vocab">
  <div class="top-bar">
    <button class="back-btn" onclick="goTo('home')">←</button>
    <div class="top-bar-title">🃏 単語カード</div>
    <div class="prog-wrap">
      <div class="prog-outer"><div class="prog-inner" id="flipProg" style="width:20%"></div></div>
      <div class="prog-label" id="flipProgLabel">1 / 5</div>
    </div>
  </div>
  <div class="vocab-mode-bar">
    <button class="mode-toggle-btn active" id="modeEN" onclick="setFlipMode('en')">英 → 日</button>

<script>
/* ============================================================
   DATA
============================================================ */
const words = [
  {

    pos: '形容詞 / 名詞',

    ex_en: 'He is an <b>American</b> singer.',

    ex_plain: 'He is an American singer.',
  },
  {
    en: 'alone',
    pos: '形容詞',
    ja: 'ひとりで・さびしい',
    ex_en: 'She practices singing <b>alone</b>.',
    ex_ja: '彼女はひとりで歌の練習をします。',
    ex_plain: 'She practices singing alone.',
  },
  {
    en: 'true',
    pos: '形容詞',
    ja: '本当の・真の',
    ex_en: 'His love for music is <b>true</b>.',
    ex_ja: '音楽への彼の愛情は本物です。',
    ex_plain: 'His love for music is true.',
  },
  {
    en: 'Bruno',
    pos: '名詞（名前）',
    ja: 'ブルーノ（名）',
    ex_en: '<b>Bruno</b> is his first name.',
    ex_ja: 'ブルーノは彼のファーストネームです。',
    ex_plain: 'Bruno is his first name.',
  },
  {
    en: 'Mars',
    pos: '名詞（名字）',
    ja: 'マーズ（姓）',
    ex_en: '<b>Mars</b> is his last name.',
    ex_ja: 'マーズは彼のラストネームです。',
    ex_plain: 'Mars is his last name.',
  },
];

/* クイズ問題 — 10問（英→日 5問 ＋ 日→英 5問）*/
function buildQuizData() {
  const qs = [];
  /* 英→日 */
  words.forEach(w => {
    const wrong = words.filter(x => x.en !== w.en).map(x => x.ja).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [w.ja, ...wrong].sort(() => Math.random() - .5);
    qs.push({
      mode: 'en→ja',
      stem: w.en,
      posLabel: w.pos,
      answer: w.ja,
      opts,
      feedback: `「<b>${w.en}</b>」は <b>${w.ja}</b> という意味だよ！`,
      audio: w.ex_plain,
    });
  });
  /* 日→英 */
  words.forEach(w => {
    const wrong = words.filter(x => x.en !== w.en).map(x => x.en).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [w.en, ...wrong].sort(() => Math.random() - .5);
    qs.push({
      mode: 'ja→en',
      stem: w.ja,
      posLabel: w.pos,
      answer: w.en,
      opts,
      feedback: `「<b>${w.ja}</b>」の英語は <b>${w.en}</b> だよ！`,
      audio: w.ex_plain,
    });
  });
  return qs.sort(() => Math.random() - .5);
}

/* ============================================================
   SPEECH
============================================================ */
let enVoice = null;
function loadVoice() {
  const voices = speechSynthesis.getVoices();
  for (const lang of ['en-US','en-GB','en-AU','en']) {
    const v = voices.find(v => v.lang.startsWith(lang) && !v.name.includes('Japanese'));
    if (v) { enVoice = v; break; }
  }
  if (!enVoice) enVoice = voices.find(v => v.lang.startsWith('en')) || null;
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoice;
  loadVoice();
}
function speak(text) {
  if (!window.speechSynthesis) return;
  if (!enVoice) loadVoice();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (enVoice) u.voice = enVoice;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

/* ============================================================
   SCREEN NAVIGATION
============================================================ */
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'vocab') { flipIdx = 0; flipMode = 'en'; isFlipped = false; showFlipFace(); renderFlip(); }
  if (id === 'wordlist') renderWordList();
  if (id === 'honbun') renderHonbun();
}

/* ============================================================
   FLIP CARDS
============================================================ */
let flipIdx = 0, flipMode = 'en', isFlipped = false;

function setFlipMode(mode) {
  flipMode = mode;
  document.getElementById('modeEN').classList.toggle('active', mode === 'en');
  document.getElementById('modeJP').classList.toggle('active', mode === 'jp');
  isFlipped = false;
  showFlipFace();
  renderFlip();
}

function showFlipFace() {
  const front = document.getElementById('flipFront');
  const back  = document.getElementById('flipBack');
  if (!front || !back) return;
  if (isFlipped) {
    front.classList.add('hidden');
    back.classList.remove('hidden');
  } else {
    front.classList.remove('hidden');
    back.classList.add('hidden');
  }
}

function renderFlip() {
  const w = words[flipIdx];
  const total = words.length;
  document.getElementById('flipCounter').textContent = `${flipIdx + 1} / ${total}`;
  document.getElementById('flipProg').style.width = `${((flipIdx + 1) / total) * 100}%`;
  document.getElementById('flipProgLabel').textContent = `${flipIdx + 1} / ${total}`;
  document.getElementById('flipPrev').disabled = flipIdx === 0;
  document.getElementById('flipNext').disabled = flipIdx === total - 1;

  if (flipMode === 'en') {
    document.getElementById('fPosFront').textContent = w.pos;
    document.getElementById('fMainFront').textContent = w.en;
    document.getElementById('fSubFront').textContent = '';
    document.getElementById('fPosBack').textContent = w.pos;
    document.getElementById('fMainBack').textContent = w.ja;
    document.getElementById('fSubBack').textContent = '';
  } else {
    document.getElementById('fPosFront').textContent = w.pos;
    document.getElementById('fMainFront').textContent = w.ja;
    document.getElementById('fSubFront').textContent = '';
    document.getElementById('fPosBack').textContent = w.pos;
    document.getElementById('fMainBack').textContent = w.en;
    document.getElementById('fSubBack').textContent = '';
  }
  document.getElementById('flipExEn').innerHTML = '📝 ' + w.ex_en;
  document.getElementById('flipExJa').textContent = '→ ' + w.ex_ja;
}

function flipCard() {
  isFlipped = !isFlipped;
  showFlipFace();
}

function moveFlip(dir) {
  flipIdx = Math.max(0, Math.min(words.length - 1, flipIdx + dir));
  isFlipped = false;
  showFlipFace();
  renderFlip();
}

function speakCurrent() {
  speak(words[flipIdx].ex_plain);
}

function speakHonbun(idx) {
  const allSents = honbunData.flatMap(s => s.sents);
  if (allSents[idx]) speak(allSents[idx].audio);
}

/* ============================================================
   QUIZ
============================================================ */
let quizData = [];
let quizIdx = 0, quizScore = 0, quizAnswered = false;

function startQuiz() {
  quizData = buildQuizData();
  quizIdx = 0; quizScore = 0;
  goTo('quiz');
  renderQuiz();
}

function renderQuiz() {
  const total = quizData.length;
  document.getElementById('quizProg').style.width = `${(quizIdx / total) * 100}%`;
  document.getElementById('quizProgLabel').textContent = `${quizIdx} / ${total}`;

  const q = quizData[quizIdx];
  document.getElementById('quizArea').innerHTML = `
    <div class="quiz-header-row">
      <div class="quiz-q-label">問 ${quizIdx + 1} / ${total}</div>
      <div class="quiz-score-badge">⭐ ${quizScore} pt</div>
    </div>
    <div class="quiz-card">
      <div class="quiz-label">${q.mode === 'en→ja' ? '英語 → 日本語' : '日本語 → 英語'}</div>
      <div class="quiz-stem">${q.stem}</div>
      <button class="quiz-audio-btn" onclick="speak('${q.audio}')">🔊 例文を聞く</button>
    </div>
    <div class="quiz-opts">
      ${q.opts.map((opt, i) => `<button class="quiz-opt" onclick="answerQuiz(${i})">${opt}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="qfb"></div>
    <button class="btn-next" id="qNext" onclick="nextQuiz()" disabled>
      ${quizIdx < total - 1 ? '次の問題 →' : '結果を見る →'}
    </button>
  `;
  quizAnswered = false;
}

function answerQuiz(idx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizData[quizIdx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.disabled = true);
  const correct = q.opts[idx] === q.answer;
  const correctIdx = q.opts.indexOf(q.answer);
  opts[correctIdx].classList.add('correct');
  const fb = document.getElementById('qfb');
  if (correct) {
    quizScore += 10;
    fb.className = 'quiz-feedback show ok';
    fb.innerHTML = `<div class="quiz-fb-title">🎉 正解！ +10pt</div>${q.feedback}`;
    showToast('🎉 正解！ +10pt');
    playOK();
    launchConfetti();
  } else {
    opts[idx].classList.add('wrong');
    fb.className = 'quiz-feedback show ng';
    fb.innerHTML = `<div class="quiz-fb-title">😅 惜しい！</div>${q.feedback}`;
    showToast('😅 もう一度覚えよう！');
    playNG();
  }
  document.getElementById('qNext').disabled = false;
}

function nextQuiz() {
  quizIdx++;
  if (quizIdx >= quizData.length) { showResult(); return; }
  renderQuiz();
}

function showResult() {
  const total = quizData.length;
  const pct = Math.round((quizScore / (total * 10)) * 100);
  let medal = '🥈', msg = 'もう一度チャレンジ！';
  if (pct >= 90) { medal = '🏆'; msg = '完璧！ブルーノ・マーズ博士に認定！'; }
  else if (pct >= 70) { medal = '🥇'; msg = 'すごい！単語マスターに認定！'; }
  else if (pct >= 50) { medal = '🥈'; msg = '合格ライン突破！もう少しで完璧！'; }
  document.getElementById('quizArea').innerHTML = `
    <div class="quiz-result show">
      <div class="result-medal">${medal}</div>
      <div class="result-title">クイズ完了！</div>
      <div class="result-score">${quizScore} / ${total * 10} pt（${pct}%）</div>
      <div class="result-msg">${msg}</div>
      <button class="btn-retry" onclick="startQuiz()">🔄 もう一度チャレンジ</button>
    </div>
  `;
}

/* ============================================================
   SOUND
============================================================ */
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playOK() {
  try {
    const ctx = getCtx();
    [523.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
      g.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
      g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + i * 0.15 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.5);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.51);
    });
  } catch(e) {}
}
function playNG() {
  try {
    const ctx = getCtx(), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.07, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.29);
  } catch(e) {}
}

/* ============================================================
   CONFETTI
============================================================ */
const cc = document.getElementById('confettiCanvas');
const cx = cc.getContext('2d');
let cParts = [], cAnim = null;
const cColors = ['#f59e0b','#fb923c','#3b82f6','#10b981','#ec4899','#8b5cf6','#fcd34d'];

function launchConfetti() {
  cc.width = window.innerWidth; cc.height = window.innerHeight;
  cParts = Array.from({length: 120}, () => ({
    x: Math.random() * cc.width, y: -10 - Math.random() * 100,
    w: 6 + Math.random() * 8, h: 3 + Math.random() * 5,
    color: cColors[Math.floor(Math.random() * cColors.length)],
    vx: (Math.random() - .5) * 3.5, vy: 2.5 + Math.random() * 3,
    angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * .18,
  }));
  if (cAnim) cancelAnimationFrame(cAnim);
  animConf();
  setTimeout(stopConf, 2600);
}
function animConf() {
  cx.clearRect(0, 0, cc.width, cc.height);
  let alive = false;
  cParts.forEach(p => {
    if (p.y > cc.height + 20) return;
    alive = true;
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.angle += p.spin;
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.angle);
    cx.fillStyle = p.color;
    cx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    cx.restore();
  });
  if (alive) cAnim = requestAnimationFrame(animConf);
  else stopConf();
}
function stopConf() {
  if (cAnim) { cancelAnimationFrame(cAnim); cAnim = null; }
  cx.clearRect(0, 0, cc.width, cc.height);
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
